name: tests
on: [push, pull_request]

# 最小权限：本工作流只读仓库内容（审计 P1-7 第 6 条）
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions 一律固定到 commit SHA（供应链硬化）。
      # 用 tag（@v4）意味着上游可以随时改变你 CI 里跑的东西；SHA 才是不可变的。
      # 注释里写明 SHA 对应的版本，方便人工升级时比对。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 22

      - name: 语法校验（提取内联脚本，编译不执行）
        run: node -e "const fs=require('fs');const m=fs.readFileSync('index.html','utf8').match(/<script>([\s\S]*?)<\/script>/);if(!m)process.exit(1);new Function(m[1]);console.log('syntax OK')"

      # 架构约束：把「任何模块不得反向引用后方模块」从注释里的口号变成可执行检查。
      # 规则已精确化为 R1（初始化期，零例外）/ R2（每帧热路径，零例外）/ R3（运行时回调，白名单登记）
      - name: 架构约束 · 模块不得反向引用
        run: node tools/check-module-order.js

      # 零依赖 lint（no-var / eqeqeq / no-redeclare / no-unused-vars）。
      # 不用 ESLint 的原因见 tools/check-lint.js 头部：本仓库连 CI 工具都刻意保持零依赖
      - name: 代码卫生（零依赖 lint）
        run: node tools/check-lint.js

      - name: DOM 引用完整性（$() 悬空引用）
        run: node tools/check-dom-ids.js

      # 覆盖率：用 Node 内置的 V8 覆盖采集（NODE_V8_COVERAGE），零依赖。
      # 双阈值（总 97% / 分区 90%）是为了防止"一个模块烂掉、另一个模块补偿"。
      # 当前实测 99.8%，唯一未覆盖的是 scheduler 的 MAX_SCHED_STEPS 防御分支。
      - name: 行覆盖率（V8 内置采集 + 双阈值）
        run: node tools/check-coverage.js --full 2>&1 | tee coverage.log

      - name: 自动化测试（全量组合扫描）
        run: |
          set -o pipefail
          FULL_SCAN=1 node tests/run.js 2>&1 | tee -a test-output.log

      # 单进程跑测试时，一旦有用例把主线程卡进死循环，进程会挂住 → CI 跑满 6 小时超时。
      # 这道看门狗给每个用例起独立子进程并按超时强杀，把「挂起」转成「明确失败」。
      - name: 死循环看门狗（每用例独立子进程 + 超时强杀）
        run: node tests/hang-guard.js 8000 2>&1 | tee -a test-output.log

      # 失败产物：CI 红的时候光看页面日志很难定位（尤其看门狗的超时与覆盖率的未覆盖行），
      # 留一份完整输出（审计 P1-7 第 5 条）
      - name: 保存测试输出（仅失败时）
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        with:
          name: test-output
          path: |
            test-output.log
            coverage.log
          if-no-files-found: ignore
